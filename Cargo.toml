[package]
name = "cyanrip-rs"
version = "0.3.0"
edition = "2024"
license = "LGPL-2.1-or-later"
publish = false

[features]
default = []
cdda = []
paranoia = ["cdda"]
backend-libcdio-sys = ["cdda", "dep:libcdio-sys"]
backend-libcdio-rs = ["cdda", "libcdio-rs"]
libcdio-rs = []

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
base64 = "0.23.1"
sha2 = "0.11.0"
crc32fast = "1.4.2"
sha1 = "0.11.0"
async-trait = "0.1.89"
serde_json = "1.0.143"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
musicbrainz_rs = "0.13.0"
hound = "3.5.1"
flacenc = { version = "0.5.1", default-features = false }
metaflac = "0.2.8"
libcdio-sys = { version = "2.0.0", default-features = false, features = ["cdda", "paranoia"], optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6.5"
claxon = "0.4.3"
