[package]
name = "cyanrip-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
base64 = "0.23.1"
sha2 = "0.11.0"
crc32fast = "1.4.2"
sha1 = "0.10.6"
async-trait = "0.1.89"
serde_json = "1.0.143"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
musicbrainz_rs = "0.13.0"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
